# The mlops-reviewer agent reviews each pull request once when it is opened (not on every push,
# to keep the cost down). Comment "@claude review again" to get a new review after changes.
# Needs: org secret ANTHROPIC_API_KEY and the Claude GitHub App on the repo.
name: claude-review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/start-stack

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Use the mlops-reviewer agent to review this pull request. The PR branch is checked out
            and the MLflow + workspace containers are running (see CLAUDE.md: use ./scripts/run).

            Post the review as ONE top-level comment with `gh pr comment`, and use
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) only for
            findings tied to a specific line. Only post GitHub comments.
          claude_args: |
            --model claude-sonnet-5-5
            --max-budget-usd 2
            --allowedTools "Bash(./scripts/run:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment,Read,Glob,Grep"

      - name: Stop containers
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yml down
