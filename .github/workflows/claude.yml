# @claude in an issue, a PR comment or a PR review runs Claude Code here, in GitHub Actions,
# next to the same containers as the Codespace (MLflow + workspace). It uses the skills and
# agents in .claude/ and answers in the thread, or pushes a branch / opens a PR.
# Only users with write access to the repo can trigger it (checked by the action).
# Needs: org secret ANTHROPIC_API_KEY and the Claude GitHub App on the repo.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.review.body, '@claude') ||
      contains(github.event.issue.body, '@claude') ||
      contains(github.event.issue.title, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/start-stack

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5-5
            --max-budget-usd 3
            --allowedTools "Bash(./scripts/run:*),Bash(docker compose:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*),Bash(gh run:*),Read,Write,Edit,Glob,Grep"

      - name: Stop containers
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yml down
