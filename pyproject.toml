[project]
name = "mlops-course"
version = "1.0.0"
description = "MLOps course pipeline: source data to a served, monitored model, tracked in MLflow"
requires-python = ">=3.12"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
